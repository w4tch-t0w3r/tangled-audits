name: accessibility-audit

on:
  repository_dispatch:
    types: [audit-request]
  workflow_dispatch:
    inputs:
      id:
        description: "Report id (hex)"
        required: true
      url:
        description: "URL to audit"
        required: true

# One group PER REPORT — a shared queue group makes GitHub cancel
# queued runs when requests arrive in bursts (only 1 pending is kept).
# Parallel runs are fine; the commit step retries around push races.
concurrency:
  group: audit-${{ github.event.client_payload.id || inputs.id }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: audit/package-lock.json

      - name: Install audit engine
        working-directory: audit
        run: npm ci

      - name: Run audit
        working-directory: audit
        # env indirection — payload values never touch the shell as code
        env:
          AUDIT_ID: ${{ github.event.client_payload.id || inputs.id }}
          AUDIT_URL: ${{ github.event.client_payload.url || inputs.url }}
        run: node run.mjs

      - name: Commit report
        run: |
          git config user.name "tangled-audit-bot"
          git config user.email "audit-bot@tangled-design.ro"
          git add reports/
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "report: $(git diff --cached --name-only | head -1)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "push race, retry $i"; sleep $((i * 2))
          done
          exit 1
